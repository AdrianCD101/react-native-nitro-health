name: Run Harness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/harness.yml'
      - 'android/**'
      - 'cpp/**'
      - 'example/__tests__/**'
      - 'example/android/**'
      - 'example/ios/**'
      - 'example/App.tsx'
      - 'example/app.json'
      - 'example/babel.config.js'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - 'example/healthPermissions.ts'
      - 'example/index.js'
      - 'example/jest.harness.config.mjs'
      - 'example/metro.config.js'
      - 'example/package.json'
      - 'example/rn-harness.config.mjs'
      - 'nitrogen/generated/android/**'
      - 'nitrogen/generated/ios/**'
      - 'nitrogen/generated/shared/**'
      - 'ios/**'
      - 'src/**'
      - '**/*.podspec'
      - '**/Podfile.lock'
      - '**/react-native.config.js'
      - 'bun.lock'
      - 'nitro.json'
      - 'package.json'
      - 'patches/**'
  pull_request:
    paths:
      - '.github/workflows/harness.yml'
      - 'android/**'
      - 'cpp/**'
      - 'example/__tests__/**'
      - 'example/android/**'
      - 'example/ios/**'
      - 'example/App.tsx'
      - 'example/app.json'
      - 'example/babel.config.js'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - 'example/healthPermissions.ts'
      - 'example/index.js'
      - 'example/jest.harness.config.mjs'
      - 'example/metro.config.js'
      - 'example/package.json'
      - 'example/rn-harness.config.mjs'
      - 'nitrogen/generated/android/**'
      - 'nitrogen/generated/ios/**'
      - 'nitrogen/generated/shared/**'
      - 'ios/**'
      - 'src/**'
      - '**/*.podspec'
      - '**/Podfile.lock'
      - '**/react-native.config.js'
      - 'bun.lock'
      - 'nitro.json'
      - 'package.json'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-android:
    name: Harness Android
    runs-on: ubuntu-latest
    env:
      RN_HARNESS_ANDROID_DISK_SIZE: 1G
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Build Android app
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Run Harness Android
        uses: callstackincubator/react-native-harness@v1.4.1
        with:
          app: android/app/build/outputs/apk/debug/app-debug.apk
          runner: android
          projectRoot: example
          packageManager: bun
          cacheAvd: false
          harnessArgs: --config jest.harness.config.mjs
          preRunHook: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

      - name: Collect Android Harness diagnostics
        if: ${{ failure() }}
        run: |
          adb devices -l > "$RUNNER_TEMP/harness-android-devices.txt" || true
          adb logcat -d > "$RUNNER_TEMP/harness-android-logcat.txt" || true

      - name: Upload Android Harness diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-android-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/harness-android-devices.txt
            ${{ runner.temp }}/harness-android-logcat.txt

  harness-ios:
    name: Harness iOS
    runs-on: macOS-15
    env:
      RN_HARNESS_IOS_SIMULATOR: iPhone 16 Pro
      RN_HARNESS_IOS_RUNTIME: '18.5'
      USE_CCACHE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS app
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroHealthExample.xcworkspace \
            -scheme NitroHealthExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build | xcpretty

      - name: Run Harness iOS
        uses: callstackincubator/react-native-harness@v1.4.1
        with:
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroHealthExample.app
          runner: ios
          projectRoot: example
          packageManager: bun
          harnessArgs: --config jest.harness.config.mjs

      - name: Collect iOS Harness diagnostics
        if: ${{ failure() }}
        run: |
          xcrun simctl list devices > "$RUNNER_TEMP/harness-ios-devices.txt" || true
          xcrun simctl spawn booted log show --last 10m > "$RUNNER_TEMP/harness-ios-simulator.log" || true

      - name: Upload iOS Harness diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-ios-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/harness-ios-devices.txt
            ${{ runner.temp }}/harness-ios-simulator.log
